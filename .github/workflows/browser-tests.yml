name: Browser regression tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    # Draft PRs get fast feedback. Ready PRs must run every release gate.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A small, fail-closed path detector. Full validation always runs at the
  # dev -> main release boundary or by manual dispatch.
  scope:
    name: Select test scope
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.classify.outputs.account }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          account=false
          full=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$TARGET_BRANCH" == "main" ]]; then
            account=true
            full=true
          else
            # A missing comparison must fail closed to the complete suite.
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] ||
               ! changes=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA"); then
              account=true
              full=true
            else
              # Account-related source, shared persistence and global UI changes
              # receive full desktop + iPhone account coverage automatically.
              # Unknown non-account features still get mandatory real UI smoke.
              if printf '%s\n' "$changes" | grep -Eq '^(src/account/|src/auth/|src/domain/|src/app/|src/components/(Account|MyRecipes|Recipe|DishRecipe|UpcomingCooks)|supabase/|e2e/auth/|tests/(account|personalRecipes|discardPlans|upcomingWorkspace|planningDraft)|playwright[.]accounts[.]config[.]ts$|playwright[.]auth[.]config[.]ts$|package(-lock)?[.]json$|[.]github/workflows/|scripts/test-account-security[.]sh$)'; then
                account=true
              fi
            fi
          fi
          echo "account=$account" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Selected scope: account=$account full=$full"

  checks:
    name: Types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test

  # Keep browser dependency installs off the moving ubuntu-latest image.
  # Ubuntu 26 rollout runners have stalled on OS-package downloads before tests.
  # Run these on every incremental commit, including draft PRs.
  # They cover a real guest cook and the critical account recovery paths.
  smoke:
    name: Critical browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Guest planning, Home and resume
        run: >-
          npx playwright test e2e/cook-flow.spec.ts
          --project=desktop-chromium
          --grep "home is a clean starting point with history access|resuming an in-progress cook preserves cooking status"
      - name: Account recovery, discard and recipe library
        run: >-
          npx playwright test
          --config=playwright.accounts.config.ts
          --project=auth-desktop
          --grep "orphaned Next cook recovery can be discarded after reload when no remote upcoming plan exists|a rejected protected recipe save does not hide existing recipes when the library reloads"
      - name: Upload smoke screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            test-results/
            test-results-accounts/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Short authentication/offline verification remains on ready PRs and pushes.
  # Expensive account and general regression work is selected below.
  browsers:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: auth
            browsers: chromium webkit
            command: npx playwright test --config playwright.auth.config.ts
          - suite: offline
            browsers: chromium webkit
            command: npm run test:offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Run ${{ matrix.suite }} tests
        run: ${{ matrix.command }}
      - name: Upload browser report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.suite }}-report
          path: |
            test-results/
            test-results-offline/
            test-results-auth/
            test-results-accounts/
            playwright-report/
            playwright-offline-report/
          if-no-files-found: ignore
          retention-days: 14

  # Relevant account edits run all desktop/iPhone account tests; other Dev PRs skip them.
  account_browsers:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.account == 'true'
    name: ${{ matrix.suite }}
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep one account worker per platform for deterministic account mocks,
          # but run desktop Chromium and iPhone WebKit on separate runners.
          - suite: accounts-desktop
            browsers: chromium
            command: npx playwright test --config playwright.accounts.config.ts --project=auth-desktop
          # Keep WebKit workers isolated; two independent shards divide
          # its measured 10m44s critical path without parallel fixture races.
          - suite: accounts-iphone-1
            browsers: webkit
            command: npx playwright test --config playwright.accounts.config.ts --project=auth-iphone --shard=1/2
          - suite: accounts-iphone-2
            browsers: webkit
            command: npx playwright test --config playwright.accounts.config.ts --project=auth-iphone --shard=2/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Run ${{ matrix.suite }} tests
        run: ${{ matrix.command }}
      - name: Upload browser report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.suite }}-report
          path: |
            test-results/
            test-results-offline/
            test-results-auth/
            test-results-accounts/
            playwright-report/
            playwright-offline-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload account review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-review-${{ matrix.suite }}-screenshots
          path: test-results-accounts/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  # Retain the original combined screenshot artifact for visual review.
  account_review:
    name: Account review screenshots
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.account == 'true' && needs.account_browsers.result == 'success'
    needs: [scope, account_browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: account-review-accounts-*-screenshots
          path: account-review-screenshots
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: account-review-screenshots
          path: account-review-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  regression_shards:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.full == 'true'
    needs: scope
    name: regression (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers and OS dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Run regression shard ${{ matrix.shard }}/3
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/raw-regression-results-${{ matrix.shard }}.json
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --reporter=github,html,json
      - name: Prepare compact timing report
        if: always()
        run: node scripts/compact-playwright-timings.mjs test-results/raw-regression-results-${{ matrix.shard }}.json test-results/regression-results-${{ matrix.shard }}.json
      - name: Upload browser report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-${{ matrix.shard }}-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      # Review images and timings remain independently downloadable from large traces/videos.
      - name: Upload shard review screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cooking-review-regression-${{ matrix.shard }}
          path: |
            test-results/cook-journeys-*/*.png
            test-results/cancel-cook-*/*.png
            test-results/serving-first-*/*.png
            test-results/recipe-first-*/*.png
            test-results/cooking-simplicity-*/*.png
            test-results/step-timing-cues-*/*.png
            test-results/post-brisket-*/*.png
            test-results/physical-cooking-*/*.png
            test-results/design-system-*/*.png
            test-results/live-cook-start-*/*.png
            test-results/whole-cook-duration-*/*.png
            test-results/cancel-cook-*/*.png
            test-results/regression-results-*.json
          if-no-files-found: error
          retention-days: 14

  # Keep the existing regression check and combined screenshot artifact names.
  # Partial screenshots survive a failed shard, but cannot turn its gate green.
  regression:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.full == 'true'
    needs: regression_shards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Collect shard review evidence
        uses: actions/download-artifact@v4
        with:
          pattern: cooking-review-regression-*
          path: review-screenshots
          merge-multiple: true
      - name: Upload combined review screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cooking-review-screenshots
          path: review-screenshots/
          if-no-files-found: error
          retention-days: 14
      - name: Require every regression shard
        if: always()
        env:
          SHARDS_RESULT: ${{ needs.regression_shards.result }}
        run: test "$SHARDS_RESULT" = success

  # Preserve the existing required check name; skipped/canceled suites must fail it.
  playwright:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [scope, checks, smoke, browsers, account_browsers, account_review, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test suite
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
          ACCOUNT_REQUIRED: ${{ needs.scope.outputs.account }}
          ACCOUNT_RESULT: ${{ needs.account_browsers.result }}
          ACCOUNT_REVIEW_RESULT: ${{ needs.account_review.result }}
          FULL_REQUIRED: ${{ needs.scope.outputs.full }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == success && "$CHECKS_RESULT" == success &&
             "$SMOKE_RESULT" == success && "$BROWSERS_RESULT" == success ]]
          if [[ "$ACCOUNT_REQUIRED" == true ]]; then
            [[ "$ACCOUNT_RESULT" == success && "$ACCOUNT_REVIEW_RESULT" == success ]]
          else
            [[ "$ACCOUNT_RESULT" == skipped && "$ACCOUNT_REVIEW_RESULT" == skipped ]]
          fi
          if [[ "$FULL_REQUIRED" == true ]]; then
            [[ "$REGRESSION_RESULT" == success ]]
          else
            [[ "$REGRESSION_RESULT" == skipped ]]
          fi
