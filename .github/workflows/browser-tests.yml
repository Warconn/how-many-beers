name: Browser regression tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Feature account sign-in tests (mock Auth responses)
        run: npx playwright test --config playwright.auth.config.ts
      - name: Account cook saving and recovery (mock API responses)
        run: npx playwright test --config playwright.accounts.config.ts
      - name: Browser tests
        run: npm run test:e2e
      - name: Built-app offline and update tests (Android Chromium / iPhone WebKit)
        run: npm run test:offline
      - name: Upload browser report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-report
          path: |
            test-results/
            test-results-offline/
            test-results-auth/
            test-results-accounts/
            playwright-report/
            playwright-offline-report/
          if-no-files-found: ignore
          retention-days: 14
